[platformio]
build_dir = ${sysenv.USERPROFILE}/.platformio/build/safealert
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/safealert

; ESP32-C6 is NOT supported by the official espressif32 platform (Arduino core 2.x).
; It requires Arduino core 3.x, which for PlatformIO comes from the pioarduino fork.
; If this URL 404s, check https://github.com/pioarduino/platform-espressif32/releases
; and substitute the current release tag.
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; The board ships with more flash than the 4 MB "default.csv" layout assumes and a
; BLE + JSON firmware on Arduino core 3.x does not fit its 1.25 MB app slot. The
; 8 MB layout keeps NVS at the same offset (0x9000), so pairing/provisioning data
; stored by an earlier flash survives a re-upload without an erase.
board_build.partitions = default_8MB.csv
; Upload and monitor both work through the board's native "USB" port (enumerates
; as "USB Serial Device", VID 303A). The "COM"/UART port can also upload, but the
; console never appears there because ARDUINO_USB_CDC_ON_BOOT moves it to USB.
; PlatformIO auto-detects the port; pass --upload-port COMx / --monitor-port COMx
; only if more than one serial device is attached.
build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; Console moves to the native USB Serial/JTAG port so that BOTH hardware UARTs
  ; stay free: the C6 has only UART0 and UART1, and we need two peripherals.
  ; ARDUINO_USB_MODE=1 selects the C6's hardware Serial/JTAG CDC (it has no USB-OTG);
  ; the board definition does not set it, and without it "Serial" resolves to the
  ; TinyUSB device that this chip does not have.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
