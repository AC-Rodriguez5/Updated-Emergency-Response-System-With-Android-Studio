name: tanzalert_facilities
description: >-
  Emergency facilities for the Philippines - hospitals, Red Cross chapters,
  MDRRMO offices, fire and police stations - from OpenStreetMap with a bundled
  offline baseline. Shared by the resident and responder apps so both find the
  same places by the same rules.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  latlong2: ^0.9.1

flutter:
  uses-material-design: true
