services:
  - type: web
    name: safealert-backend
    runtime: node
    region: oregon
    rootDir: SafeAlert-Emergency-Response/backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FCM_ENABLED
        value: 'true'
      - key: OVERPASS_URL
        sync: false
      - key: ROUTING_URL
        sync: false
