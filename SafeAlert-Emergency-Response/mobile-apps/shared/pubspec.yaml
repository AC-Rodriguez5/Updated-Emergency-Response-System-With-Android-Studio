name: safealert_mobile
description: Shared SafeAlert mobile workflows and platform services.
publish_to: none
version: 1.0.0
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  uuid: ^4.5.2
  socket_io_client: ^3.1.4
  image_picker: ^1.2.2
  file_picker: ^10.3.10
  flutter_blue_plus: ^1.36.8
  permission_handler: ^11.4.0
  flutter_background_service: ^5.1.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
