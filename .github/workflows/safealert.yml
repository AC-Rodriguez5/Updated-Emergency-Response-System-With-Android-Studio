name: SafeAlert maintained system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SafeAlert-Emergency-Response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            SafeAlert-Emergency-Response/backend/package-lock.json
            SafeAlert-Emergency-Response/admin-web/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix admin-web
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend test
      - run: npm --prefix backend run build
      - run: npm --prefix admin-web run typecheck
      - run: npm --prefix admin-web test
      - run: npm --prefix admin-web run build
      - run: npx --prefix admin-web playwright install --with-deps chromium
      - run: npm --prefix admin-web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: SafeAlert-Emergency-Response/admin-web/test-results
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [User, Responder]
    defaults:
      run:
        working-directory: SafeAlert-Emergency-Response/mobile-apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: SafeAlert-Emergency-Response/mobile-apps/shared
      - run: flutter analyze
        working-directory: SafeAlert-Emergency-Response/mobile-apps/shared
      - run: flutter test
        working-directory: SafeAlert-Emergency-Response/mobile-apps/shared
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}-debug
          path: SafeAlert-Emergency-Response/mobile-apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - run: pio run -d SafeAlert-Emergency-Response/firmware/esp32
